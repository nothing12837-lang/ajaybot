name: AjayBot Paper Trading

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajaybot-paper.yml'
      - 'run_paper_cycle.py'
      - 'setup.py'
      - 'bot/**'
      - 'config/**'

permissions:
  contents: write
  actions: read

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
      DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Built-in GitHub token — always available, no setup needed
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: nothing12837-lang/ajaybot

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull bot state from GitHub (primary)
        run: python sync_github.py pull || echo "No existing GitHub state (first run)"

      - name: Pull bot state from HF (fallback, if HF_TOKEN valid)
        run: python sync_state.py pull || echo "HF pull skipped/failed"

      - name: Run paper trading cycle
        run: python run_paper_cycle.py

      - name: Ping Hermes gateway on Render (keeps Render 24/7 awake)
        run: curl -s -m 20 https://hermes-gateway-wib4.onrender.com/health || true

      - name: Push state to GitHub (primary — always works)
        run: python sync_github.py push || echo "GitHub push failed"

      - name: Push state to HF (fallback)
        run: python sync_state.py push || echo "HF push skipped/failed"

      - name: Commit optimizer config changes back to repo
        run: |
          git config user.name "AjayBot[auto]"
          git config user.email "ajaybot@users.noreply.github.com"
          git add config/config.yaml data/ || true
          git diff --staged --quiet || git commit -m "chore: bot state sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || true

      - name: Notify on failure
        if: failure()
        run: |
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_ALLOWED_USERS}" \
            -d text="⚠️ AjayBot paper trading run failed: ${{ github.run_id }}"
