name: Worker A (Ping-Pong)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bot-singleton
  cancel-in-progress: true

jobs:
  run-bot-a:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull State (Restore Memory)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python sync_github.py pull || python sync_state.py pull || echo 'No state found or failed, continuing...'

      - name: Run Bot + Telegram Chatbot (Radha)
        env:
          DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MNEMOSYNE_DATA_DIR: ${{ github.workspace }}/mnemosyne_data
        run: |
          echo "Starting Telegram Chatbot (Radha) in background..."
          python radha_telegram.py > radha.log 2>&1 &
          sleep 3
          echo "Starting Trading Bot..."
          PORT=10000 timeout 18720 python app.py || echo "Bot finished or timed out gracefully"

      - name: Push State (Save Memory)
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python sync_github.py push || python sync_state.py push || echo 'Push failed'

      - name: Trigger Worker B
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ env.GH_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/worker_b.yml/dispatches \
          -d '{"ref":"main"}'

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-worker-a
          path: |
            *.log
