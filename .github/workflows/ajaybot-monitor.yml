name: AjayBot Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: rareember/ajaybot-state
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: nothing12837-lang/ajaybot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install huggingface_hub

      - name: Check Paper Trading Workflow
        id: check_workflow
        run: |
          RUN=$(gh api repos/$REPO/actions/workflows/ajaybot-paper.yml/runs --jq '.workflow_runs[0]')
          STATUS=$(echo "$RUN" | jq -r '.conclusion // "running"')
          RUN_ID=$(echo "$RUN" | jq -r '.id // ""')
          CREATED=$(echo "$RUN" | jq -r '.created_at // ""')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "created=$CREATED" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "failure" ]; then
            echo "error=Paper trading workflow failed (run $RUN_ID)" >> $GITHUB_OUTPUT
          elif [ "$STATUS" = "cancelled" ]; then
            echo "error=Paper trading workflow cancelled (run $RUN_ID)" >> $GITHUB_OUTPUT
          fi

      - name: Check Bot State Sync Cron
        id: check_bot_sync
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          from datetime import datetime, timezone

          api = HfApi(token=os.environ.get('HF_TOKEN'))
          commits = list(api.list_repo_commits(repo_id=os.environ['HF_REPO'], repo_type='dataset'))
          if commits:
              latest = commits[0]
              created_str = str(latest.created_at)
              if created_str.endswith('Z'):
                  created_str = created_str[:-1] + '+00:00'
              commit_time = datetime.fromisoformat(created_str)
              hours_ago = (datetime.now(timezone.utc) - commit_time).total_seconds() / 3600
              print(f'Hours since last bot state sync: {hours_ago:.1f}')
              if hours_ago > 14:
                  print('WARNING: Bot state sync overdue')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'bot_sync_warning=Bot state sync overdue ({hours_ago:.1f}h ago)\n')
              else:
                  print('Bot state sync OK')
          "

      - name: Fetch Trading Performance
        id: fetch_performance
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          import json, tempfile, os
          from pathlib import Path

          with tempfile.TemporaryDirectory() as tmpdir:
              tmp = Path(tmpdir)
              snapshot_download(
                  repo_id=os.environ['HF_REPO'],
                  repo_type='dataset',
                  token=os.environ.get('HF_TOKEN'),
                  local_dir=tmp
              )
              state_file = tmp / 'bot_state.json'
              trades_file = tmp / 'trades_history.json'

              equity = 0.0
              positions = 0
              total_trades = 0
              wins = 0
              losses = 0
              net_pnl = 0.0

              if state_file.exists():
                  with open(state_file) as f:
                      state = json.load(f)
                  equity = float(state.get('equity', 0.0))
                  pos_data = state.get('positions', {})
                  positions = len(pos_data) if isinstance(pos_data, (dict, list)) else 0

              if trades_file.exists():
                  with open(trades_file) as f:
                      trades = json.load(f)
                  if isinstance(trades, list):
                      total_trades = len(trades)
                      for t in trades:
                          pnl = float(t.get('pnl', 0.0))
                          net_pnl += pnl
                          if pnl > 0:
                              wins += 1
                          elif pnl < 0:
                              losses += 1

              win_rate = (wins / total_trades * 100.0) if total_trades > 0 else 0.0

              print(f'Equity: Rs.{equity:,.2f}')
              print(f'Open Positions: {positions}')
              print(f'Total Trades: {total_trades}')
              print(f'Wins: {wins} | Losses: {losses}')
              print(f'Win Rate: {win_rate:.1f}%')
              print(f'Net PnL: Rs.{net_pnl:,.2f}')

              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'equity={equity:,.2f}\n')
                  f.write(f'positions={positions}\n')
                  f.write(f'trades={total_trades}\n')
                  f.write(f'win_rate={win_rate:.1f}\n')
                  f.write(f'net_pnl={net_pnl:,.2f}\n')
          "

      - name: Send Telegram Alert on Error
        if: steps.check_workflow.outputs.error != '' || steps.check_bot_sync.outputs.bot_sync_warning != ''
        run: |
          python -c "
          import urllib.request, urllib.parse, os

          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_ALLOWED_USERS', '').split(',')[0].strip()
          err_msg = '''${{ steps.check_workflow.outputs.error }}'''
          sync_warn = '''${{ steps.check_bot_sync.outputs.bot_sync_warning }}'''
          run_id = '''${{ steps.check_workflow.outputs.run_id }}'''
          repo = os.environ.get('REPO', 'nothing12837-lang/ajaybot')

          lines = ['⚠️ <b>AjayBot Alert</b>\n']
          if err_msg:
              lines.append(f'🚨 <b>Workflow Error:</b> {err_msg}')
          if sync_warn:
              lines.append(f'⚠️ <b>Sync Warning:</b> {sync_warn}')
          if run_id:
              lines.append(f'Run: https://github.com/{repo}/actions/runs/{run_id}')

          msg = '\n'.join(lines)
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}).encode()
          try:
              req = urllib.request.Request(url, data=data)
              urllib.request.urlopen(req)
              print('Alert sent')
          except Exception as e:
              print(f'Failed to send alert: {e}')
          "

      - name: Send Daily Performance Summary
        if: github.event.schedule == '0 5 * * *'  # 10:30 AM IST = 5:00 UTC
        run: |
          python -c "
          import urllib.request, urllib.parse, os

          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          chat_id = os.environ.get('TELEGRAM_ALLOWED_USERS', '').split(',')[0].strip()
          equity = '''${{ steps.fetch_performance.outputs.equity }}'''
          positions = '''${{ steps.fetch_performance.outputs.positions }}'''
          trades = '''${{ steps.fetch_performance.outputs.trades }}'''
          win_rate = '''${{ steps.fetch_performance.outputs.win_rate }}'''
          net_pnl = '''${{ steps.fetch_performance.outputs.net_pnl }}'''
          repo = os.environ.get('REPO', 'nothing12837-lang/ajaybot')

          msg = (
              f'📊 <b>AjayBot Daily Performance</b>\n\n'
              f'💰 Equity: ₹{equity}\n'
              f'📈 Open Positions: {positions}\n'
              f'📋 Total Trades: {trades}\n'
              f'🎯 Win Rate: {win_rate}%\n'
              f'💵 Net PnL: ₹{net_pnl}\n\n'
              f'Workflow: https://github.com/{repo}/actions/workflows/ajaybot-paper.yml'
          )
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}).encode()
          try:
              req = urllib.request.Request(url, data=data)
              urllib.request.urlopen(req)
              print('Daily summary sent')
          except Exception as e:
              print(f'Failed to send summary: {e}')
          "

      - name: Send Hourly Performance Update
        if: github.event_name == 'schedule' && github.event.schedule != '0 5 * * *'
        run: |
          python -c "
          import urllib.request, urllib.parse, os, time

          # Send brief update every 2 hours to avoid spam
          if (int(time.time()) // 7200) % 2 == 0:
              token = os.environ.get('TELEGRAM_BOT_TOKEN')
              chat_id = os.environ.get('TELEGRAM_ALLOWED_USERS', '').split(',')[0].strip()
              equity = '''${{ steps.fetch_performance.outputs.equity }}'''
              positions = '''${{ steps.fetch_performance.outputs.positions }}'''
              trades = '''${{ steps.fetch_performance.outputs.trades }}'''
              net_pnl = '''${{ steps.fetch_performance.outputs.net_pnl }}'''

              msg = f'🤖 <b>AjayBot Status</b>\nEquity: ₹{equity} | Positions: {positions} | Trades: {trades} | PnL: ₹{net_pnl}'
              url = f'https://api.telegram.org/bot{token}/sendMessage'
              data = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}).encode()
              try:
                  req = urllib.request.Request(url, data=data)
                  urllib.request.urlopen(req)
                  print('Status update sent')
              except Exception as e:
                  print(f'Failed to send update: {e}')
          "
