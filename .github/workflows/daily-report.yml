name: Daily Performance Report (10:30 AM IST)

on:
  schedule:
    # 10:30 AM IST is 05:00 AM UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull State from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_github.py pull || echo "state pull skipped"

      - name: Run Daily Performance Report
        run: |
          python scripts/daily_report.py
