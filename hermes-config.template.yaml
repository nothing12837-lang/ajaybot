# Hermes cloud config for Render free (512MB RAM). NO SECRETS HERE.
# Secrets come from Render dashboard env vars (gateway trust_env=true):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, NVIDIA_API_KEY,
#   GROQ_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY, HF_TOKEN
# __HERMES_MODEL__ is replaced by hermes_gateway.py from $HERMES_MODEL.
model:
  default: __HERMES_MODEL__
  provider: nvidia
providers:
  nvidia:
    context_length: 1000000
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.8-flash
    context_length: 1000000
  groq:
    base_url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    context_length: 128000
  openrouter:
    base_url: https://openrouter.ai/api/v1
fallback_providers:
  - provider: nvidia
    model: meta/llama-3.3-70b-instruct
  - provider: nvidia
    model: __HERMES_MODEL__
  - provider: nvidia
    model: meta/llama-3.3-70b-instruct
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
# Low RAM: 2 sessions max on 512MB free instance
max_concurrent_sessions: 2
agent:
  max_turns: 200
  api_max_retries: 5
  auto_recovery_cycles: 10
  service_tier: ''
  fast_auto_seconds: 15
  disabled_toolsets:
    - browser
    - computer_use
    - vision
    - video
    - feishu
    - spotify
    - discord
    - homeassistant
  reasoning_overrides:
    openai/gpt-oss-120b: low
  verbose: false
  reasoning_effort: low
terminal:
  backend: local
  cwd: .
  timeout: 120
  lifetime_seconds: 180
compression:
  enabled: true
  checkpoint_required: false
  threshold: 0.50
  threshold_tokens: 35000
  target_ratio: 0.3
  protect_last_n: 20
prompt_caching:
  cache_ttl: 5m
auxiliary:
  compression:
    provider: nvidia
    model: meta/llama-3.3-70b-instruct
  title_generation:
    provider: nvidia
    model: meta/llama-3.3-70b-instruct
  background_review:
    provider: nvidia
    model: meta/llama-3.3-70b-instruct
display:
  busy_input_mode: interrupt
  streaming: true
memory:
  memory_enabled: true
  provider: mnemosyne
  # core profile = ~50MB, no local embeddings (fits 512MB).
  # Do NOT enable local vector embeddings on Render free.
mnemosyne:
  embeddings:
    provider: "none"
stt:
  provider: groq
  model: whisper-large-v3-turbo
plugins:
  enabled:
    - mnemosyne
  disabled:
    - slack-platform
    - discord-platform
auth:
  adopt_external_logins: true
cron:
  catch_up_missed: true
gateway:
  platform_connect_timeout: 30
  loop_watchdog: true
  allow_all_users: false
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  trust_env: true
  strict: false
  scale_to_zero:
    idle_timeout_minutes: 60
group_sessions_per_user: true
platform_toolsets:
  telegram:
    - hermes-telegram
worktree: true
_config_version: 45
