name: Hermes 24x7

on:
  schedule:
    - cron: '0 */5 * * *'   # Every 5 hours (restart cycle)
  workflow_dispatch:         # Manual trigger too

permissions:
  contents: write

jobs:
  run-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 345     # 5h 45min max (GitHub limit is 6h)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git chromium-browser

      - name: Install Hermes Agent + deps
        run: |
          pip install requests pyyaml huggingface_hub feedparser PyNaCl
          # Use official Hermes shell installer (pip is NOT supported)
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.hermes/bin" >> $GITHUB_PATH
          export PATH="$HOME/.hermes/bin:$PATH"
          hermes --version

      - name: Setup hermes-home, seeds & config
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p hermes-home/mnemosyne hermes-home/cron hermes-home/memories/user hermes-home/memories/memory hermes-home/skills
          cp hermes-config.template.yaml hermes-home/config.yaml
          sed -i 's/__HERMES_MODEL__/moonshotai\/kimi-k3/g' hermes-home/config.yaml
          sed -i 's/max_concurrent_sessions: 2/max_concurrent_sessions: 10/g' hermes-home/config.yaml

          # Copy seed identity, memories and user files so Radha NEVER forgets Ajay
          if [ -d "seeds" ]; then
            cp seeds/SOUL.md hermes-home/SOUL.md
            cp seeds/USER.md hermes-home/USER.md
            cp seeds/MEMORY.md hermes-home/MEMORY.md
            cp seeds/USER.md hermes-home/memories/user/ajay_rajbhar.md 2>/dev/null || true
            cp seeds/MEMORY.md hermes-home/memories/memory/general_memory.md 2>/dev/null || true
            if [ -d "seeds/skills" ]; then
              cp -r seeds/skills/* hermes-home/skills/ 2>/dev/null || true
            fi
          fi

          # Channel directory for Ajay Rajbhar
          cat > hermes-home/channel_directory.json << EOF
          {
            "telegram": {
              "default": "5238068527",
              "5238068527": {
                "name": "Ajay Rajbhar",
                "type": "dm"
              }
            }
          }
          EOF

          # Write full .env so Hermes reads all API keys (root and hermes-home)
          cat > .env << EOF
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
          NVIDIA_API_KEY=${NVIDIA_API_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GITHUB_TOKEN=${GITHUB_TOKEN}
          GH_TOKEN=${GH_TOKEN}
          HERMES_MODEL=moonshotai/kimi-k3
          TELEGRAM_HOME_CHANNEL=5238068527
          EOF
          cp .env hermes-home/.env
          echo "Hermes environment and Radha identity seeded!"

      - name: Restore memory from GitHub bot-state
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          HERMES_HOME: ${{ github.workspace }}/hermes-home
        run: |
          python sync_github.py pull-hermes && echo "Memory successfully restored!" || echo "Pull failed or empty"

      - name: Run Hermes Gateway with continuous background sync (5.5 hours)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          HERMES_MODEL: moonshotai/kimi-k3
          HERMES_HOME: ${{ github.workspace }}/hermes-home
        run: |
          # Continuous background sync every 5 minutes to GitHub
          python -c "
          import time, subprocess, sys
          while True:
              time.sleep(300)
              try:
                  subprocess.run([sys.executable, 'sync_github.py', 'push-hermes'], timeout=60)
                  print('Auto-synced memory to GitHub (5min tick)')
              except Exception as e:
                  print('Background sync notice:', e)
          " &
          SYNC_PID=$!

          # Run Hermes gateway
          timeout 19800 hermes gateway run || echo "Hermes finished session window"

          # Kill background sync loop
          kill $SYNC_PID 2>/dev/null || true

      - name: Save memory to GitHub bot-state (BEFORE shutdown)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          HERMES_HOME: ${{ github.workspace }}/hermes-home
        run: |
          python sync_github.py push-hermes && echo "Final memory saved!" || echo "Final memory save warning"

      - name: Trigger next cycle immediately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run hermes-24x7.yml --repo ${{ github.repository }} --ref main || echo "Next cycle trigger skipped"
