name: Keep Alive Ping

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Hermes gateway (keeps Render free from sleeping)
        run: |
          curl -s -o /dev/null -w "hermes HTTP %{http_code} - %{time_total}s\n" -m 20 https://hermes-gateway-wib4.onrender.com/health || exit 1
