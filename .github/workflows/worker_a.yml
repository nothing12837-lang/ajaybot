name: Worker A (Ping)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-bot-a:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt -r hermes-requirements.txt huggingface_hub
      
      - name: Pull State (Restore Memory)
        env:
          HF_TOKEN: $\{{ secrets.HF_TOKEN }}
        run: python sync_state.py pull || echo "No state found or failed, continuing..."

      - name: Run Bot for 5.2 Hours
        env:
          TELEGRAM_TOKEN: $\{{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: $\{{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: $\{{ secrets.OPENROUTER_API_KEY }}
        run: timeout 18720 python app.py || echo "Bot finished or timed out gracefully"
        
      - name: Push State (Save Memory)
        env:
          HF_TOKEN: $\{{ secrets.HF_TOKEN }}
        run: python sync_state.py push || echo "Push failed"

      - name: Trigger Worker B (Pong)
        env:
          GH_TOKEN: $\{{ secrets.GH_PAT }}
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token " \
          https://api.github.com/repos/$\{{ github.repository }}/actions/workflows/worker_b.yml/dispatches \
          -d '{"ref":"main"}'

