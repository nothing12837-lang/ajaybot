name: Manager Report (8 AM / 8 PM IST)

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST (02:30 UTC)
    - cron: '30 14 * * *' # 8:00 PM IST (14:30 UTC)
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull State
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python sync_github.py pull || true

      - name: Run Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: python scripts/daily_report.py
