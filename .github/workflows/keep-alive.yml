name: Keep Alive Ping

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} - %{time_total}s\n" -m 15 https://ajaybot-r76x.onrender.com/ || exit 1