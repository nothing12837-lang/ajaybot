risk:
  max_daily_loss_pct: 0.05
  max_dd_kill_pct: 0.20
  max_position_pct: 0.25
  max_correlated_risk_pct: 0.10
  consecutive_loss_pause: 4
  consecutive_loss_pause_hours: 0.5
  paper_equity: 10000.0
  maker_fee_pct: 0.0002
  taker_fee_pct: 0.0005
  slippage_pct: 0.0001

telegram:
  enabled: true
  bot_token: ""  # from env TELEGRAM_BOT_TOKEN
  chat_id: "5238068527"
  alert_signals: true
  alert_trades: true
  alert_risk: true
  heartbeat_hours: 4

webui:
  host: "0.0.0.0"
  port: 8081
  password: "ajaybot2026"
  jwt_secret: "ajaybot-secret-change-me"
  jwt_expire_hours: 24

data_dir: data

adaptive:
  enabled: true
  target_accuracy: 0.75
  target_sharpe: 1.5
  target_max_dd: 0.10
  optimization_interval_hours: 2
  min_trades_for_optimization: 5
  exploration_rate: 0.2
  confidence_scaling: true
  volatility_scaling: true
  kelly_fraction: 0.3

ai_analyst:
  enabled: true
  model: "gemini-2.5-flash"
  weight: 0.25
  min_confidence: 0.6

optimizer:
  enabled: true
  interval_hours: 2
  lookback_days: 7
  min_trades: 30